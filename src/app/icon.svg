<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The hub is a six-bay panel with one bay lit, which is both what the
    product is and what the roadmap currently looks like. Drawn as three
    columns by two rows to match the real pad grid.

    No text: a letterform at 16px is a smudge, and six blocks with one
    of them red survives being shrunk into a tab.
  -->
  <rect width="32" height="32" rx="7" fill="#C9C6BF"/>
  <rect x="2.5" y="2.5" width="27" height="27" rx="5" fill="#DEDBD4"/>

  <g fill="#ACA89F">
    <!-- top row: Warden is lit, the rest are blanking plates -->
    <rect x="5"    y="6"    width="7" height="8.6" rx="1.6" fill="#D8341F"/>
    <rect x="13.5" y="6"    width="7" height="8.6" rx="1.6"/>
    <rect x="22"   y="6"    width="7" height="8.6" rx="1.6"/>
    <!-- bottom row -->
    <rect x="5"    y="17.4" width="7" height="8.6" rx="1.6"/>
    <rect x="13.5" y="17.4" width="7" height="8.6" rx="1.6"/>
    <rect x="22"   y="17.4" width="7" height="8.6" rx="1.6"/>
  </g>
</svg>
